<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Watcher</title><link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0f1722">
</head><body><div class="wrap">
<h1 class="brand"><img src="/logo.svg" alt="" width="44" height="44"> The Watcher</h1>
<div class="bar"><span id="cam" class="chip">checking…</span><label class="sw" title="Turns the camera and detection on or off"><input type="checkbox" id="camsw"><span class="trk"></span><span id="camsw-t">Camera</span></label><span id="now" class="dim"></span></div>
<div class="big">
  <a href="/camera">View Camera<small>live feed with detection boxes</small></a>
  <a href="/logs">View Logs<small>snapshots, summaries, name what it saw</small></a>
</div>
<div id="last" class="dim"></div>
</div>
<script>
async function tick(){
  try{
    const s=await (await fetch('/api/status')).json();
    const c=document.getElementById('cam');
    c.textContent=!s.enabled?'camera turned off':s.camera_online?'camera online':'camera OFFLINE';
    c.className='chip '+(!s.enabled?'':s.camera_online?'ok':'bad');setSw(s.enabled);
    document.getElementById('now').textContent=s.now_local+' · right now: '+s.scene_now.join(', ');
    document.getElementById('last').textContent=s.last_event?('Last log: '+s.last_event.local+' - '+s.last_event.summary):'';
  }catch(e){document.getElementById('cam').textContent='unreachable';}
}
async function loadSw(){try{const s=await(await fetch('/api/status')).json();setSw(s.enabled);}catch(e){}}
function setSw(on){const c=document.getElementById('camsw');if(!c)return;c.checked=on;document.getElementById('camsw-t').textContent='Camera '+(on?'on':'off');}
document.getElementById('camsw').addEventListener('change',async e=>{
  const on=e.target.checked;e.target.disabled=true;
  try{const j=await(await fetch('/api/camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on})})).json();setSw(j.enabled);}
  catch(x){setSw(!on);} finally{e.target.disabled=false;}
});
loadSw();
tick();setInterval(tick,5000);
</script><script src="/menu.js"></script></body></html>
